[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tamil-asr"
version = "0.1.0"
description = "Whisper fine-tuned for Tamil speech recognition with honest WER/CER evaluation"
authors = [{ name = "Sharbesh S" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.36", "plotly>=5.20"]

[project.urls]
Author = "https://github.com/SharbeshS8199"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
