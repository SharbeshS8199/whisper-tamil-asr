# Free Colab T4: whisper-small, 4000 steps ≈ 4-5 hours (use --max-steps 1500 for a ~2 h run).
base_model: openai/whisper-small
language: tamil
output_dir: outputs/whisper-small-ta
hub_model_id: SharbeshS8199/whisper-small-tamil

train_sets:
  - name: google/fleurs          # open, ~10 h of read Tamil speech
    config: ta_in
    split: train+validation
    text: transcription
  - name: ai4bharat/IndicVoices  # AI4Bharat: natural speech from across Tamil Nadu. Gated: accept terms on HF, then `huggingface-cli login`
    config: tamil
    split: train
    text: auto                   # detect the transcript column
    max_samples: 20000
    enabled: false               # set true after getting access

eval_set:
  name: google/fleurs
  config: ta_in
  split: test

train:
  max_steps: 4000
  learning_rate: 1.0e-5
  warmup_steps: 500
  batch_size: 16
  grad_accum: 1
  eval_steps: 1000
  max_label_tokens: 448
  max_audio_seconds: 30
